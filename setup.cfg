[tool:black]
line-length = 120
target-version = ['py37']

[flake8]
max-line-length = 120
ignore = E501,W503,E203

[mypy]
disable_error_code = override
ignore_missing_imports = True
install_types = True
exclude = tests/fixtures/.*

[tool:pytest]
pythonpath = .
testpaths = tests
log_cli = true
log_cli_level = DEBUG
log_cli_format = [%(asctime)s] [%(levelname)-8s] [%(name)s:%(lineno)d] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = DEBUG
